[project]
name = "certo"
version = "0.1.27"
description = "A coding-agent harness that isn't tied to one model or provider: it picks a model per task, switches when one fails, and checks the work with your own tests."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alessio Ricco" }]
keywords = [
    "ai",
    "agent",
    "coding-agent",
    "llm",
    "openhands",
    "litellm",
    "verification",
    "testing",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # openhands-sdk and openhands-tools are a MATCHED SET: keep the two version
    # specifiers identical and upgrade them together, or imports will break.
    # Pinned to the version verified against this codebase (see ROADMAP.md
    # "SDK-drift" entries) — bump both together deliberately, then re-verify
    # every unconfirmed SDK symbol via /verify-sdk before relying on it.
    "openhands-sdk==1.47.0",
    "openhands-tools==1.47.0",
    "python-dotenv>=1.0",
    # Already ships transitively via openhands-sdk — listed explicitly here
    # since model_catalog.py imports it directly, not ad hoc. (runner.py's
    # provider/API-failure detection for auto model selection uses the
    # SDK's own openhands.sdk.llm.exceptions.types.LLMError instead of a
    # LiteLLM/openai exception type directly — see ROADMAP.md's decisions
    # log for why two earlier guesses at the right type were both wrong —
    # so no extra LLM-library dependency is needed for that.)
    "pyyaml>=6.0",
    # Already ships transitively via openhands-sdk; listed because menus.py
    # (certo init's arrow-key menus) imports it directly. choice() is in
    # 3.0.53, the version verified.
    "prompt-toolkit>=3.0.53",
]

[project.urls]
Homepage = "https://github.com/alessioricco/certo"
Repository = "https://github.com/alessioricco/certo"
Issues = "https://github.com/alessioricco/certo/issues"
Documentation = "https://github.com/alessioricco/certo/blob/main/docs/README.md"

[project.optional-dependencies]
# sqlalchemy: tests/test_task_store.py exercises SQLTaskStore against real sqlite.
dev = ["pytest>=8.0", "ruff>=0.6", "sqlalchemy>=2.0"]
# Sandboxed/remote execution (CERTO_EXECUTION=docker). See docs/history/SPEC.md section 9.
sandbox = ["openhands-workspace", "openhands-agent-server"]
# HTTP/WebSocket server mode (certo-server). See docs/history/SPEC.md section 9.
server = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "httpx>=0.27"]
# Server-mode task registry persistence (CERTO_TASK_STORE). See
# docs/guides/run-as-a-server.md "Keep task records". sqlite needs only
# SQLAlchemy (its DBAPI driver is Python's stdlib sqlite3); mysql/postgres each need their own extra on
# top since a deployment typically only uses one SQL backend.
store-sqlite = ["sqlalchemy>=2.0"]
store-mysql = ["sqlalchemy>=2.0", "pymysql>=1.1"]
store-postgres = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
store-redis = ["redis>=5.0"]

[project.scripts]
certo = "certo.cli:main"
certo-server = "certo.server:main"
certo-admin = "certo.admin_cli:main"

[build-system]
# >=1.27 for PEP 639 `license`/`license-files`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# What ships is an explicit list, and the excludes repeat the secret/state
# patterns from .gitignore, so a missing or edited .gitignore can't leak
# local files into a release. tests/test_packaging.py checks both archives.
[tool.hatch.build.targets.wheel]
packages = ["src/certo"]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.DS_Store",
    "**/.env",
    "**/.env.local",
    "**/.envrc",
    "**/models.yaml",
    "**/models_list.yaml",
    "**/*.db",
    "**/*.sqlite",
    "**/*.sqlite3",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/certo",
    "/tests",
    "/docker/agent-server.Dockerfile",
    "/README.md",
    "/MANUAL.md",
    "/LICENSE",
    "/pyproject.toml",
    "/.env.example",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.DS_Store",
    "**/.env",
    "**/.env.local",
    "**/.envrc",
    "**/models.yaml",
    "**/models_list.yaml",
    "**/*.db",
    "**/*.sqlite",
    "**/*.sqlite3",
    "**/third_party_skills",
    "**/third_party_skills.lock.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff's defaults before 0.16, named so an upgrade can't change what is
# checked (0.16 raised the default set from 59 rules to 413).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Since 0.17 ruff also formats Python code blocks in Markdown; the samples
# in docs/ stay as written.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"