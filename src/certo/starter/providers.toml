# Providers and default models offered by `certo init`, in menu order.
#
# Keep this the only place these defaults live. Before each release, check
# every `model` against the provider's own model list (`source`) and
# LiteLLM's model map
# (https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json),
# then update `checked`. Prefer a good, reasonably priced coding model over
# the most expensive one: a first task should not cost much.

[[provider]]
id = "openai"
label = "OpenAI"
model = "openai/gpt-6.1-sol"
key_env = "OPENAI_API_KEY"
key_url = "https://platform.openai.com/api-keys"
source = "https://developers.openai.com/api/docs/models"
checked = "2026-10-15"

[[provider]]
id = "anthropic"
label = "Anthropic (Claude)"
model = "anthropic/claude-sonnet-5-5"
key_env = "ANTHROPIC_API_KEY"
key_url = "https://platform.claude.com/settings/keys"
source = "https://platform.claude.com/docs/en/about-claude/models/overview"
checked = "2026-10-15"

[[provider]]
id = "gemini"
label = "Google Gemini"
model = "gemini/gemini-3.8-flash"
key_env = "GEMINI_API_KEY"
key_url = "https://aistudio.google.com/apikey"
source = "https://ai.google.dev/gemini-api/docs/models"
checked = "2026-10-15"

[[provider]]
id = "deepseek"
label = "DeepSeek"
# The provider's current name. LiteLLM's price map (LiteLLM 1.100.1,
# checked 2026-10-20) still knows only the legacy deepseek-v4-flash,
# which DeepSeek routes to the same model, so a run's cost may show as
# unknown until LiteLLM catches up.
model = "deepseek/deepseek-flash"
key_env = "DEEPSEEK_API_KEY"
key_url = "https://platform.deepseek.com/api_keys"
source = "https://api-docs.deepseek.com/quick_start/pricing"
checked = "2026-10-20"

[[provider]]
# The id is LiteLLM's prefix for Kimi models (moonshot/...).
id = "moonshot"
label = "Kimi (Moonshot AI)"
# Kimi K2 models are closed to new users since 31 Oct 2026 and retire by
# the end of 2026; K3.1 Pro is the current one (in LiteLLM's price list).
model = "moonshot/kimi-k3.1-pro"
key_env = "MOONSHOT_API_KEY"
key_url = "https://platform.kimi.ai/console/api-keys"
source = "https://platform.kimi.ai/docs/pricing/chat"
checked = "2026-11-07"

[[provider]]
id = "ollama"
label = "Ollama (local models, no API key)"
# Measured: 27/27 hidden tests in docs/benchmark/baseline-0.1.18-local.md,
# against 18/27 for qwen3-coder:30b, the default before 0.1.19.
model = "ollama/qwen3.8:27b"
# For machines with less than about 20 GB of GPU or unified memory. Never
# benchmarked; expect it to be weaker than the default on multi-step tasks.
small_model = "ollama/qwen2.5-coder:7b"
base_url = "http://localhost:11434"
# Written as CERTO_LLM_TIMEOUT_SECONDS. The default, 300, is too short for
# a local model that thinks at length: on qwen3.8:27b (2026-10-22) calls
# took longer, failed and restarted from scratch (hanoi lost about 20 of
# 42 minutes; space-rocks gave up after 5). Same value as models_list.yaml.
llm_timeout_seconds = 1200
source = "https://ollama.com/library/qwen3.8"
checked = "2026-10-19"

[[provider]]
id = "other"
label = "Other (any LiteLLM model id)"
source = "https://docs.litellm.ai/docs/providers"
