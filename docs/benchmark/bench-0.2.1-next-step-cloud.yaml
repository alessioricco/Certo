# A turn that ends on a sentence of plans is sent back (Certo 0.2.1,
# commit 71d85b3), on a cloud model: the expenses task in milestones on
# Haiku, to show that a model which doesn't end on plans runs as before.
# Run it from the repository root with:
#   certo bench --config docs/benchmark/bench-0.2.1-next-step-cloud.yaml
# Every model below must be enabled in your models.yaml; see
# docs/guides/write-a-benchmark-file.md.
tasks_dir: app-tasks
tasks: [expenses]
repeats: 3
arms:
  - {name: haiku-expenses-next-step, strategy: single, model: claude-haiku-5-5, milestones: true}
