# The derived ladder of bench-0.2.4-ladder-computed.yaml (qwen3.8 ->
# Terra -> Sonnet, 60 minutes per task), with independent tests: before
# each build, the first rung (qwen3.8) writes three sets of tests from the
# task, and after the verdict they run on the work. Report only, so the
# verdicts compare with the run without them
# (docs/benchmark/ladder-computed-0.2.4.md, 12/13, fooled once on
# semver-order, which Haiku's tests caught in a replay).
# A night slot, under caffeinate -i, with the fan on turing:
#   caffeinate -i .venv/bin/certo bench --config docs/benchmark/bench-0.2.4-ladder-independent.yaml --pause-between 900 --yes
models_file: docs/benchmark/models-0.2.4-ratings.yaml
models_list_file: docs/benchmark/models_list-0.2.4-computed.yaml
tasks: all
repeats: 1
arms:
  - {name: ladder-independent, strategy: escalate, max_task_seconds: 3600, independent_tests: true}
