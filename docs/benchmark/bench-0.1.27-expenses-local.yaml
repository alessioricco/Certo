# The expenses app task (app-tasks, apps-2) on a local model, Certo
# 0.1.27: the arm of bench-0.1.27-milestones-60min-local.yaml (qwen3.8,
# 65,536-token window, 60 minutes per milestone) on a smaller app task
# than the spreadsheet. Run it from the repository root with:
#   certo bench --config docs/benchmark/bench-0.1.27-expenses-local.yaml
# Every model below must be enabled in your models.yaml; see
# docs/guides/write-a-benchmark-file.md.
tasks_dir: app-tasks
tasks: [expenses]
repeats: 3
arms:
  - {name: qwen-expenses-milestones, strategy: single, model: qwen3.8-27b-local, context_tokens: 65536, max_task_seconds: 3600, milestones: true}
