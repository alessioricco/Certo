# The python-environment and node-project-setup skills on a local model
# (Certo 0.1.27): the arms of bench-0.1.27-setup-skills-cloud.yaml with
# qwen3.8 (65,536-token window), 3 repeats each. Run it from the
# repository root with:
#   certo bench --config docs/benchmark/bench-0.1.27-setup-skills-local.yaml
# Every model below must be enabled in your models.yaml; see
# docs/guides/write-a-benchmark-file.md.
tasks_dir: skill-tasks
tasks: [word-tally-node, yaml-merge]
repeats: 3
arms:
  - {name: qwen-no-skills, strategy: single, model: qwen3.8-27b-local, context_tokens: 65536, skills_off: [python-environment, node-project-setup]}
  - {name: qwen-skills, strategy: single, model: qwen3.8-27b-local, context_tokens: 65536}
