# Escalate on reasoning effort (Certo 0.2.2), on a local model: qwen3.8
# with thinking off, then on when that fails, against thinking on only.
# (On Ollama, qwen3.8 has no effort levels: low and high both send
# `think: true`.) One
# repeat of the 13 bundled tasks per arm, to fit one night (local runs
# take minutes each); the cloud arms are in bench-0.2.2-effort-cloud.yaml.
# Both qwen entries have a 65,536-token window in the model list, so
# every rung of both arms gets the same window.
# Run it from the repository root with:
#   certo bench --config docs/benchmark/bench-0.2.2-effort-local.yaml --stop-at 07:00
models_file: docs/benchmark/models-0.2.2-effort.yaml
models_list_file: docs/benchmark/models_list-0.2.2-effort.yaml
tasks: all
repeats: 1
arms:
  - {name: qwen-high, strategy: single, model: qwen-high}
  - {name: qwen-nothink-then-high, strategy: escalate, models: [qwen-nothink, qwen-high]}
